<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抄表指数录入</title>
    <!-- 五角星的svg作为网站的logo，不引用外部文件 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon fill='black' points='50 3.061616997868383e-15 61.80339887498948 36.60254037844387 98.19660112501052 36.60254037844387 68.19660112501052 59.80762113533156 79.99999999999999 96.41016151377543 50 73.20508075688775 20.000000000000007 96.41016151377543 31.80339887498948 59.80762113533156 1.803398874989481 36.60254037844387 38.19660112501052 36.60254037844387'/%3E%3C/svg%3E"
    />

    <script src="./vue.min.js"></script>
    <script src="./xlsx.mini.js"></script>
    <style>

      s,
      samp,

      strike,

      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,

      ul,

      form,

      legend,

      tfoot,
      thead,

      /* HTML5 display-role reset for older browsers */

    <style>
      #app {
        display: flex;
        flex-direction: column;
        padding: 10px 20px;
        text-align: center;
      }

      #app > #title {
        font-size: 32px;
        font-weight: bold;
        padding-top: 20px;
      }

      #app > #excelFile {
        display: none;
      }

      #app > #excelInput {
        cursor: pointer;
        /* color: #555666; */
        color: whitesmoke;
        line-height: 26px;
        border-radius: 14px;
        border: 1px solid #ccccd8;
        background-color: #409eff;
        padding: 4px 10px;
      }
      #app > #excelInput:hover {
        background-color: #66b1ff;
      }

      #app > #userData {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: start;
        padding: 15px 10px;
      }

      #app > #userLastIndex {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: start;
        /* padding: 20px 0px; */
        font-size: 20px;
        padding: 0 10px;
      }

      #app > #userLastIndex > #userLastIndexNumber {
        width: 100%;
        text-align: center;
        font-size: 30px;
      }

      #app > #userCurrentIndex {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: start;
        /* padding: 20px 0px; */
        font-size: 20px;
        padding: 0 10px;
      }

      #app > #userCurrentIndex > input {
        width: 80%;
        margin: 2px auto;
        font-size: 28px;
        text-align: center;
        border: 1px solid #ccccd8;
        border-radius: 4px;
      }
      #app > #userCurrentIndex > input:focus {
        outline: none;
        border: 1px solid #409eff;
      }

      #app > #submitChange,
      #app > #exportExcel {
        cursor: pointer;
        height: 36px;
        line-height: 36px;
        border-radius: 14px;
        border: 1px solid #67c23aff;
        background-color: #67c23aff;
        color: #ffffff;
        margin: 10px 0px;
      }

      #app > #exportExcel {
        background-color: transparent;
        color: #67c23a;
        border: 1px solid #67c23a;
      }

      #app > #submitChange:disabled,
      #app > #exportExcel:disabled {
        /* color: #555666; */
        /* color: whitesmoke; */
        color: gray;
        border: 1px solid #ccccd8;
        background-color: transparent;
      }

      #app > #abnormalRatio {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px 0px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div
        id="title"
        @click="()=>{detailDisplay = !detailDisplay;console.log(detailDisplay)}"
      >
        <span
          style="
            border: 1px solid;
            border-radius: 14px;
            padding: 4px 15px;
            cursor: pointer;
            text-align: center;
          "
          :style="detailDisplay?{borderColor:'#409eff',color:'#409eff'}:{borderColor:'#ccccd8ff',color:'#555666ff'}"
        >
          指数录入
        </span>
      </div>

      <!-- 突增突减比例设置 -->
      <div
        id="abnormalRatio"
        style="display: flex; justify-content: center; align-items: center"
      >
        <div style="">突增突减比例：</div>
        <input
          type="number"
          v-model="ratio"
          style="width: 60px; text-align: center"
        />
        <div style="margin-left: 10px">%</div>
      </div>

      <label id="excelInput" for="excelFile">请选择录入模板</label>

      <input
        type="file"
        id="excelFile"
        name="excelFile"
        accept=".xlsx,.xls"
        required
        placeholder="请选择指数录入模板"
        @change="openExcel"
      />

      <div id="userData">
        <div>当前用户：</div>
        <span v-for="(value, key) in userData" :key="key">
          <span
            v-if="key === '抄表号' || key === '计费号' || key === '用户名称' || key === '水表地址'"
          >
            {{ key }} : {{ value }}
          </span>
          <span v-else-if="detailDisplay">
            <span v-if=" key !=='currentIndex'"> {{ key }} : {{ value }} </span>
            <!-- <span v-if="key === '指数'">
        
            </span> -->
          </span>
        </span>
        <!-- 上期用量 -->
        <span>
          <span v-if="detailDisplay">上期用量 : {{ lastUsage }}</span>
        </span>
      </div>
      <div id="userLastIndex">
        <div>上期指数：</div>
        <div id="userLastIndexNumber">{{ userData.指数 || 0 }}</div>
      </div>
      <div id="userCurrentIndex">
        <div>本期指数：</div>
        <input
          id="userCurrentIndexInput"
          type="number"
          v-model="userCurrentIndex"
        />
      </div>
      <button
        @click="submitChange"
        :disabled="isSubmitDisabled || isExcelDisabled"
        id="submitChange"
      >
        <span style="color: red" v-if="isSubmitDisabled || isExcelDisabled"
          >🚫</span
        >
        确认录入
      </button>
      <button @click="exportExcel" :disabled="isExcelDisabled" id="exportExcel">
        <span style="color: red" v-if="isExcelDisabled">🚫</span>
        生成excel
      </button>

      <div v-if="!isExcelDisabled">
        <div>当前行:{{ currentLine}}</div>
        <div>总共行数:{{ totelLine }}</div>
      </div>
    </div>
  </body>

  <script>
    const vm = new Vue({
      el: "#app",
      data() {
        return {
          buttonName: "导入Excel",
          // userData: {
          //   抄表号: "F40722214",
          //   计费号: "442667",
          //   用户名称: "武红",
          //   水表地址: "测试-101",
          //   指数: 17,
          // },
          userData: {
            抄表号: "",
            计费号: "",
            用户名称: "",
            水表地址: "",
            指数: 0,
          },

          displayKeys: ["抄表号", "计费号", "用户名称", "水表地址"],
          detailDisplay: false,

          userCurrentIndex: "",

          // excel所有数据
          excelData: [],

          // 总共的行数
          currentLine: 1,
          totelLine: 0,
          // 已经录入的行
          totelSubmitLine: [],
          isSubmitDisabled: true,
          isExcelDisabled: true,
          fileName: "",
          sheetName: "",
          lastUsage: 0,

          ratio: 30,
        };
      },
      mounted() {
        console.log(this.isSubmitDisabled || this.isExcelDisabled);
      },
      methods: {
        openExcel() {
          // 获得文件对象
          const file = document.getElementById("excelFile").files[0];
          console.log(file);
          this.fileName = file.name;
          // 使用XLSX读取文件的每一行
          const reader = new FileReader();
          reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            console.log(workbook);
            const sheetName = workbook.SheetNames[0];
            this.sheetName = sheetName;
            const sheet = workbook.Sheets[sheetName];
            const sheetData = XLSX.utils.sheet_to_json(sheet);
            console.log(sheetData);
            // 将第一行的数据赋值给userData
            const firstRow = sheetData[0];
            for (const key in firstRow) {
              if (Object.hasOwnProperty.call(firstRow, key)) {
                this.userData[key] = firstRow[key];
              }
            }
            // 将excel所有数据赋值给excelData
            this.excelData = sheetData;
            // 计算总共的行数
            this.totelLine = sheetData.length;
          };
          reader.readAsArrayBuffer(file);
          // 聚焦到本期指数的输入框
          this.$nextTick(() => {
            document.getElementById("userCurrentIndexInput").focus();
          });

          this.isExcelDisabled = false;
        },

        // 判断是否是手机端
        isMobile() {
          const userAgentInfo = navigator.userAgent;
          const Agents = [
            "Android",
            "iPhone",
            "SymbianOS",
            "Windows Phone",
            "iPad",
            "iPod",
          ];
          let flag = false;
          for (let v = 0; v < Agents.length; v++) {
            if (userAgentInfo.indexOf(Agents[v]) > 0) {
              flag = true;
              break;
            }
          }
          return flag;
        },

        submitChange() {
          // 如果本期指数小于上期指数，提示用户
          if (this.userCurrentIndex < this.userData.指数) {
            alert("本期指数小于上期指数，请检查！");
            return;
          }
          console.log(this.userCurrentIndex);
          this.userData.currentIndex = Number(this.userCurrentIndex);
          console.log(this.userData);
          // 将excelData中的数据更新
          const index = this.excelData.findIndex(
            (item) => item.抄表号 === this.userData.抄表号
          );
          // 更新excelData中的当前指数
          this.excelData[index].currentIndex = this.userCurrentIndex;
          // userData中指数减去最后一列是上期用量,当前录入的指数减去指数是本期用量，如果本期用量相比上期用量增幅超过30%，则提示用户水量突增，如果减幅超过30%，则提示用户水量突减
          const currentUsage = this.userData.currentIndex - this.userData.指数;

          const usageChange = currentUsage - this.lastUsage;
          const usageChangePercent = (usageChange / this.lastUsage) * 100;
          console.log(usageChangePercent);
          if (usageChangePercent > this.ratio) {
            alert("水量突增");
          } else if (usageChangePercent < -this.ratio) {
            alert("水量突减");
          }
          if (this.currentLine === this.totelLine) {
            alert("录入成功，当前已经是最后一行");
            return;
          } else {
            this.currentLine++;
            this.nextUser();
          }
        },

        nextUser() {
          // 清空本期指数
          this.userCurrentIndex = "";
          // 找到下一个用户
          const nextUserIndex = this.currentLine - 1;
          // console.log(nextUserIndex);
          // 将下一个用户的数据赋值给userData
          const nextUserData = this.excelData[nextUserIndex];
          for (const key in nextUserData) {
            if (Object.hasOwnProperty.call(nextUserData, key)) {
              this.userData[key] = nextUserData[key];
            }
          }
          this.userCurrentIndex = "";
          // 聚焦到本期指数的输入框
          this.$nextTick(() => {
            document.getElementById("userCurrentIndexInput").focus();
          });
          // 拉起输入法（如果是手机端）
          // 解决safari浏览器下，输入法不弹出的问题
        },

        exportExcel() {
          // 将excelData中的数据导出
          // 如果每一行中没有currentIndex，就使用指数代替,如果有，就使用currentIndex代替指数
          this.excelData.forEach((item) => {
            // 添加一列，例如现在是2023-10，表格原数据是2023-08，就加一列2023-08指数，值为修改之前的指数
            if (item.录入月份) {
              item[item.录入月份] = item.指数;
            }
            if (item.currentIndex) {
              item.指数 = Number(item.currentIndex);
              delete item.currentIndex;
            }
            // 时间格式：2023-10
            item.录入月份 = new Date().toISOString().slice(0, 7);
          });
          const sheet = XLSX.utils.json_to_sheet(this.excelData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, sheet, this.sheetName);
          // 如果文件名为 2023-08 A小区1单元这种形式 那么将其中的2023-08替换为当前时间
          const fileName = this.fileName;
          const reg = /\d{4}-\d{2}/;
          if (reg.test(fileName)) {
            this.fileName = fileName.replace(
              reg,
              new Date().toISOString().slice(0, 7)
            );
          }
          // 如果文件名为A小区1单元这种形式 那么在文件名前面加上当前时间
          if (!reg.test(fileName)) {
            this.fileName =
              new Date().toISOString().slice(0, 7) + " " + fileName;
          }

          XLSX.writeFile(
            workbook,
            this.fileName
            // { bookType: "xlsx", bookSST: false, type: "array" }
          );
        },
      },

      // 监听userData的变化，如果本期指数小于上期指数，不可用 deep: true
      watch: {
        userData: {
          handler() {
            if (this.userCurrentIndex < this.userData.指数) {
              this.isSubmitDisabled = true;
            } else {
              this.isSubmitDisabled = false;
            }

            const lastIndex = this.userData.指数;
            const currentIndex = this.userCurrentIndex;
            const userDataKey = Object.keys(this.userData);
            let lastIndexKey = "";
            // 如果userDataKey中有currentIndex，那么值是length-2，否则是length-1
            if (userDataKey.includes("currentIndex")) {
              lastIndexKey = userDataKey[userDataKey.length - 2];
            } else {
              lastIndexKey = userDataKey[userDataKey.length - 1];
            }
            console.log(lastIndexKey);

            const lastUsage = this.userData.指数 - this.userData[lastIndexKey];
            this.lastUsage = lastUsage;
            console.log(lastUsage);
          },
          deep: true,
          immediate: true,
        },
        // 监听本期指数的变化，如果本期指数小于上期指数，不可用，否则可用
        userCurrentIndex() {
          if (this.userCurrentIndex < this.userData.指数) {
            this.isSubmitDisabled = true;
          } else {
            this.isSubmitDisabled = false;
          }
        },
      },
    });
  </script>
</html>
